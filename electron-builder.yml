appId: com.slideup.app
productName: Slide-up
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
# Runtime NDI livrée avec l'app (pas besoin d'installer NDI Tools côté émetteur)
extraResources:
  - from: resources/ndi/slideup-ndi.exe
    to: ndi/slideup-ndi.exe
  - from: resources/ndi/Processing.NDI.Lib.x64.dll
    to: ndi/Processing.NDI.Lib.x64.dll
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon-16.png
    to: icon-16.png
win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Slide-up
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
